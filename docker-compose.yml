services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-flow-app
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      VITE_APP_NAME: Ticket-Flow
    volumes:
      - .:/var/www/html
      - sqlite-data:/var/www/html/database
    working_dir: /var/www/html
    command: >
      bash -lc "php artisan migrate --force && apache2-foreground"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-flow-queue
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
      - sqlite-data:/var/www/html/database
    working_dir: /var/www/html
    command: bash -lc "php artisan queue:work --tries=3 --sleep=5 --timeout=60"
    restart: unless-stopped

volumes:
  sqlite-data:
